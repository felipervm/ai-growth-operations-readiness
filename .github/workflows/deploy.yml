name: Test and deploy Control Room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check app.js
      - name: Verify static assets and HTML references
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          js=Path('app.js').read_text()
          css=Path('styles.css').read_text()
          assert '<script src="app.js"' in html
          assert 'href="styles.css"' in html
          assert 'id="page"' in html and 'id="shade"' in html
          assert "render();" in js
          assert '@media(max-width:760px)' in css
          assert len(js)>5000 and len(css)>5000
          print('Static checks passed')
          PY
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
