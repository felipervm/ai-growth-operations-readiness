name: Validate and deploy research page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research page
        run: |
          node --check script.js
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text()
          assert '<link rel="stylesheet" href="styles.css">' in h
          assert '<script src="script.js"' in h
          for section in ['signals','opportunities','fit','sources']:
              assert f'id="{section}"' in h
          assert h.count('https://blog.kraken.com/')>=3
          assert 'www.payward.com/press-release/our-ai-doctrine' in h
          assert 'Not affiliated with' in h or 'Not affiliated' in h or 'Not affiliated with or endorsed' in h
          print('Research page verified')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
